<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
<title id="title">PhishGuard — explainable browser protection</title><desc id="description">Animated presentation of automatic assessment, risk warnings and private local reports. Respect reduced motion.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081318"/><stop offset="1" stop-color="#142620"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8db5a6" stroke-opacity=".07"/></pattern><linearGradient id="shine"><stop stop-color="#bded42"/><stop offset="1" stop-color="#7ebd65"/></linearGradient></defs>
<style>@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-44}}.pulse{animation:pulse 3s ease-in-out infinite}.flow{animation:flow 2s linear infinite}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#grid)"/>
<path d="M80 72 128 90v35c0 27-22 47-48 59-26-12-48-32-48-59V90Z" fill="#b7ef35" fill-opacity=".08" stroke="#b7ef35" stroke-width="3"/><path d="m57 121 15 15 32-35" fill="none" stroke="#b7ef35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="157" y="113" fill="#f3faf6" font-size="50" font-weight="800">PhishGuard</text><text x="159" y="144" fill="#b7c9c1" font-size="18" letter-spacing="2">EXPLAINABLE BROWSER RISK ASSESSMENTS</text>
<rect x="896" y="65" width="244" height="34" rx="17" fill="#b7ef35" fill-opacity=".1" stroke="#b7ef35" stroke-opacity=".3"/><circle cx="916" cy="82" r="4" fill="#b7ef35" class="pulse"/><text x="930" y="87" fill="#c8ef9a" font-size="13" font-weight="700">RULE BASED · PRIVACY FIRST</text>
<text x="52" y="216" fill="#f3faf6" font-size="26" font-weight="700">One source. Clear decisions. Local evidence.</text><text x="52" y="250" fill="#9db5ac" font-size="17">Automatic page assessments · account-separated dashboards · monthly PDF reports</text>
<path class="flow" d="M278 325H350M620 325H692M962 325H1032" stroke="#b7ef35" stroke-opacity=".65" stroke-width="2" stroke-dasharray="7 15"/>
<g fill="#10211d" stroke="#395347"><rect x="52" y="291" width="227" height="65" rx="12"/><rect x="350" y="291" width="270" height="65" rx="12"/><rect x="692" y="291" width="270" height="65" rx="12"/></g>
<text x="77" y="320" fill="#b7ef35" font-size="12" font-weight="700">01 / OBSERVE</text><text x="77" y="343" fill="#e9f1ed" font-size="15">URL + structural indicators</text><text x="375" y="320" fill="#b7ef35" font-size="12" font-weight="700">02 / EXPLAIN</text><text x="375" y="343" fill="#e9f1ed" font-size="15">Weighted rules + risk response</text><text x="717" y="320" fill="#b7ef35" font-size="12" font-weight="700">03 / REVIEW</text><text x="717" y="343" fill="#e9f1ed" font-size="15">Local history + readable PDFs</text><circle class="pulse" cx="1085" cy="325" r="26" fill="#b7ef35" fill-opacity=".1" stroke="#b7ef35"/><path d="m1073 325 8 8 15-17" stroke="#b7ef35" stroke-width="3" fill="none"/>
</svg>
