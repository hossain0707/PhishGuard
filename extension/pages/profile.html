<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PhishGuard Profile</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d2e;
        --text: #e0e0e0;
        --muted: #888;
        --line: #2a2d3e;
        --blue: #1a6fbf;
      }
      :root[data-theme="light"] {
        --bg: #f4f7fb;
        --card: #fff;
        --text: #202532;
        --muted: #687080;
        --line: #dfe5ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        background: var(--card);
        border-bottom: 2px solid var(--line);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header button {
        margin-left: auto;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        padding: 8px 13px;
        border-radius: 5px;
        cursor: pointer;
      }
      .card {
        max-width: 620px;
        margin: 35px auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 30px;
      }
      .row {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .row span {
        display: block;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        border: 0;
        border-radius: 5px;
        padding: 10px 15px;
        cursor: pointer;
        background: var(--blue);
        color: #fff;
      }
      .danger {
        background: #c83245;
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header>🛡️ <b>PhishGuard User Profile</b><button id="back">← Dashboard</button></header>
    <main class="card">
      <div class="row">
        <span>Full Name</span>
        <form id="profile-form">
          <label for="name">Display name</label><input id="name" maxlength="100" required /><button
            type="submit"
            class="btn"
          >
            Save name
          </button>
        </form>
      </div>
      <div class="row"><span>Email Address</span><strong id="email">—</strong></div>
      <div class="row"><span>Member Since</span><strong id="created">—</strong></div>
      <div class="row"><span>Extension Version</span><strong id="version">4.1.0</strong></div>
      <div class="row">
        <label
          ><input type="checkbox" id="reputation-opt-in" /> Enable optional reputation checks (URLs
          will be sent to the PhishGuard site and Google Safe Browsing when configured).</label
        >
        <p>
          Disabled by default. Requires a free, noncommercial API key set by the operator. No-match
          is not a safety verdict.
        </p>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <p>Your history remains local and separated by account. Logging out preserves it.</p>
      <div class="actions">
        <button class="btn" id="connect-browser">Register this browser</button
        ><button class="btn danger" id="erase">Erase my local history</button
        ><button class="btn" id="theme">Toggle Theme</button
        ><button class="btn danger" id="logout">Log Out</button>
      </div>
    </main>
    <script src="profile.js"></script>
  </body>
</html>
