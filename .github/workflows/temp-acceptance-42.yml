name: Temporary feature acceptance
on:
  push:
    branches: [feature/lecturer-multistage-mobile-reports-20261017]
permissions:
  contents: write
concurrency:
  group: feature-acceptance-test
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lecturer-multistage-mobile-reports-20261017
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx prettier --write .
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run lint:extension
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run demo
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:all
      - name: Save canonical formatting on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || git commit -m "Apply formatting after full feature acceptance"
          git push origin HEAD:feature/lecturer-multistage-mobile-reports-20261017
