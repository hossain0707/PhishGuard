name: Format feature branch safely
on:
  push:
    branches: [feature/free-fyp-release-prep-20261012]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run format
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit formatting and lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Normalize formatting and dependency lockfile"
            git push origin HEAD:feature/free-fyp-release-prep-20261012
          fi
