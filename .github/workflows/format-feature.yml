name: Format feature branch safely
on:
  push:
    branches: [feature/free-fyp-release-prep-20261012]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run format
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Publish formatted code to clean review branch
        run: |
          git reset --soft 6374397b9b6e502c12c0d7dddf187a02832e071a
          rm -f .github/workflows/format-feature.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Normalize formatting and dependency lockfile"
            git push origin HEAD:feature/fyp-release-ready-20261012
          fi
