name: Temporary marketplace HTML formatter
on:
  push:
    branches:
      - release/edge-firefox-free-stores-20261012
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --include=dev
      - run: npx prettier --write website/index.html
      - name: Push formatting only
        run: |
          git add website/index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format marketplace homepage for CI"
          git push origin HEAD:release/edge-firefox-free-stores-20261012
