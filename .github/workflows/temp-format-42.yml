name: Temporary 4.2 formatting
on:
  push:
    branches: [feature/lecturer-multistage-mobile-reports-20261017]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/lecturer-multistage-mobile-reports-20261017
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx prettier --write shared/risk.js shared/archive.js extension/src/content.js extension/src/background.js extension/src/report.js extension/src/profile.js extension/pages/profile.html extension/pages/report.html website/index.html website/src/script.js website/style.css website/privacy.html website/manifest.webmanifest api/reputation.js tests/core.test.mjs tests/browser.mjs tests/package.test.mjs docs/LECTURER-IMPROVEMENTS.md README.md
      - name: Commit formatted files into feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared extension website api tests README.md docs/LECTURER-IMPROVEMENTS.md
          git diff --cached --quiet || git commit -m "Apply repository formatting to lecturer improvements"
          git push origin HEAD:feature/lecturer-multistage-mobile-reports-20261017
