name: Verify PhishGuard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run lint:extension
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run demo
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:all
      # GitHub artifact uploads are intentionally disabled while the account's
      # artifact-storage quota is exhausted. Results remain in workflow logs.

